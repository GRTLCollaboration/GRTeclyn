[project]
name = "grteclyn-wrapper"
version = "0.1.0"
description = "Python episode runner and failure-atlas tooling for GRTeclyn SupportedWormholeCollapse"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "cma>=3.3",
    # Required by the scoring objective: evolved-frame operational FTL and
    # effective energy conditions reconstruct the 4-metric from plotfiles via yt
    # (scipy backs the finite-difference stencils).  These guide the CMA-ES
    # search, so they are no longer optional.
    "scipy>=1.10",
    "yt>=4.0",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.8",
]

visualization = [
    "matplotlib>=3.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "yt>=4.0",
]

[project.scripts]
grteclyn-wrapper = "grteclyn_wrapper.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grteclyn_wrapper"]

[tool.uv]
managed = true
