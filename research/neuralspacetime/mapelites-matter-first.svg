<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Matter-first versus metric-first discovery</title>
  <desc id="desc">Metric-first starts from a target metric and derives stress energy. Matter-first proposes matter, solves constraints, evolves spacetime, and measures FTL in the evolved field.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="520" fill="#ffffff" />

  <style>
    .panel { fill: #ffffff; stroke: #555555; stroke-width: 2; }
    .box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #000000; text-anchor: middle; }
    .small { font-size: 15px; }
    .title { font-size: 18px; font-weight: 700; }
    .arrow { fill: none; stroke: #111111; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>

  <rect class="panel" x="45" y="40" width="465" height="430" rx="8" />
  <text class="text title" x="277" y="75">Metric-first (classic warp literature)</text>

  <rect class="box" x="135" y="105" width="285" height="65" rx="6" />
  <text class="text small" x="277" y="132">
    <tspan x="277" dy="0">1. Choose target metric</tspan>
    <tspan x="277" dy="20">Alcubierre / Natario / ...</tspan>
  </text>

  <rect class="box" x="135" y="205" width="285" height="65" rx="6" />
  <text class="text small" x="277" y="232">
    <tspan x="277" dy="0">2. Compute T_ab = G_ab / 8pi</tspan>
    <tspan x="277" dy="20">always exotic / often singular</tspan>
  </text>

  <rect class="box" x="135" y="305" width="285" height="65" rx="6" />
  <text class="text small" x="277" y="332">
    <tspan x="277" dy="0">3. Ask whether real matter</tspan>
    <tspan x="277" dy="20">can source this T_ab</tspan>
  </text>

  <rect class="box" x="135" y="405" width="285" height="45" rx="6" />
  <text class="text small" x="277" y="433">FTL baked into coordinates</text>

  <path class="arrow" d="M277 170 L277 205" />
  <path class="arrow" d="M277 270 L277 305" />
  <path class="arrow" d="M277 370 L277 405" />

  <rect class="panel" x="590" y="40" width="465" height="430" rx="8" />
  <text class="text title" x="822" y="75">Matter-first (this pipeline)</text>

  <rect class="box" x="680" y="105" width="285" height="65" rx="6" />
  <text class="text small" x="822" y="132">
    <tspan x="822" dy="0">1. Propose matter lumps</tspan>
    <tspan x="822" dy="20">fields / boosts / mass</tspan>
  </text>

  <rect class="box" x="680" y="205" width="285" height="65" rx="6" />
  <text class="text small" x="822" y="232">
    <tspan x="822" dy="0">2. Solve Einstein constraints</tspan>
    <tspan x="822" dy="20">geometry the matter sources</tspan>
  </text>

  <rect class="box" x="680" y="305" width="285" height="65" rx="6" />
  <text class="text small" x="822" y="332">
    <tspan x="822" dy="0">3. Evolve spacetime forward</tspan>
    <tspan x="822" dy="20">t = 0 to STOP_TIME</tspan>
  </text>

  <rect class="box" x="680" y="405" width="285" height="45" rx="6" />
  <text class="text small" x="822" y="433">4. Measure FTL in evolved field</text>

  <path class="arrow" d="M822 170 L822 205" />
  <path class="arrow" d="M822 270 L822 305" />
  <path class="arrow" d="M822 370 L822 405" />
</svg>
