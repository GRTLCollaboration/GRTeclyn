<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">Geometry-first versus matter-first discovery</title>
  <desc id="desc">Geometry-first prescribes a metric and reads off stress-energy. Matter-first proposes matter, solves constraints, evolves, and scores with 4D probes.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#000000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1040" height="520" fill="#ffffff"/>
  <style>
    text { font-family: "Times New Roman", Times, Georgia, serif; fill: #000000; }
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .step { font-size: 16px; font-weight: 700; text-anchor: middle; }
    .sub { font-size: 13px; text-anchor: middle; }
    .edge { fill: none; stroke: #000000; stroke-width: 1.6; marker-end: url(#arrow); }
    .head { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .panel { fill: none; stroke: #000000; stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>

  <rect class="panel" x="40" y="55" width="440" height="430" rx="8"/>
  <text class="head" x="260" y="40">Geometry-first (classic)</text>

  <rect class="box" x="95" y="80" width="330" height="70" rx="5"/>
  <text class="step" x="260" y="108">1. Prescribe g</text>
  <text class="sub" x="260" y="130">Alcubierre / Natario</text>

  <rect class="box" x="95" y="180" width="330" height="70" rx="5"/>
  <text class="step" x="260" y="208">2. Read off T = G/8π</text>
  <text class="sub" x="260" y="230">exotic, often singular</text>

  <rect class="box" x="95" y="280" width="330" height="70" rx="5"/>
  <text class="step" x="260" y="308">3. Hope matter exists</text>
  <text class="sub" x="260" y="330">no consistent IVP</text>

  <rect class="box" x="95" y="380" width="330" height="70" rx="5"/>
  <text class="step" x="260" y="408">4. FTL in coordinates</text>
  <text class="sub" x="260" y="430">need not survive evolution</text>

  <path class="edge" d="M260 150 L260 180"/>
  <path class="edge" d="M260 250 L260 280"/>
  <path class="edge" d="M260 350 L260 380"/>

  <rect class="panel" x="560" y="55" width="440" height="430" rx="8"/>
  <text class="head" x="780" y="40">Matter-first (this work)</text>

  <rect class="box" x="615" y="80" width="330" height="70" rx="5"/>
  <text class="step" x="780" y="108">1. MAP-Elites proposes matter</text>
  <text class="sub" x="780" y="130">39-D Q-ball genome</text>

  <rect class="box" x="615" y="180" width="330" height="70" rx="5"/>
  <text class="step" x="780" y="208">2. GRTresna + post-load gate</text>
  <text class="sub" x="780" y="230">constraint-clean initial data</text>

  <rect class="box" x="615" y="280" width="330" height="70" rx="5"/>
  <text class="step" x="780" y="308">3. GRTeclyn evolves on GPU</text>
  <text class="sub" x="780" y="330">full 3+1 dynamics</text>

  <rect class="box" x="615" y="380" width="330" height="70" rx="5"/>
  <text class="step" x="780" y="408">4. 4D probes → score/archive</text>
  <text class="sub" x="780" y="430">evolving null shortcut f_geo</text>

  <path class="edge" d="M780 150 L780 180"/>
  <path class="edge" d="M780 250 L780 280"/>
  <path class="edge" d="M780 350 L780 380"/>
</svg>
