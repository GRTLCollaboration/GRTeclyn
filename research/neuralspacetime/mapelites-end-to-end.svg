<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MAP-Elites end-to-end overview</title>
  <desc id="desc">Search proposes matter, GRTresna solves constraints, GRTeclyn evolves the spacetime, probes score it, and the archive feeds the next proposal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" fill="#ffffff" />

  <style>
    .panel { fill: #ffffff; stroke: #777777; stroke-width: 2; }
    .box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #000000; text-anchor: middle; }
    .small { font-size: 15px; }
    .title { font-size: 18px; font-weight: 700; }
    .arrow { fill: none; stroke: #111111; stroke-width: 2.5; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 7 6; }
    .label-bg { fill: #ffffff; stroke: none; }
  </style>

  <text class="text title" x="600" y="42">MAP-Elites FTL Discovery Loop</text>

  <rect class="panel" x="35" y="75" width="1130" height="195" rx="8" />
  <text class="text title" x="600" y="105">Main simulation pipeline</text>

  <rect class="box" x="70" y="145" width="150" height="70" rx="6" />
  <text class="text small" x="145" y="172">
    <tspan x="145" dy="0">Proposer</tspan>
    <tspan x="145" dy="20">matter params</tspan>
  </text>

  <rect class="box" x="280" y="145" width="170" height="70" rx="6" />
  <text class="text small" x="365" y="172">
    <tspan x="365" dy="0">GRTresna</tspan>
    <tspan x="365" dy="20">constraint solve</tspan>
  </text>

  <rect class="box" x="510" y="145" width="170" height="70" rx="6" />
  <text class="text small" x="595" y="172">
    <tspan x="595" dy="0">GRTeclyn</tspan>
    <tspan x="595" dy="20">GPU evolution</tspan>
  </text>

  <rect class="box" x="740" y="145" width="150" height="70" rx="6" />
  <text class="text small" x="815" y="172">
    <tspan x="815" dy="0">Plotfiles</tspan>
    <tspan x="815" dy="20">constraint logs</tspan>
  </text>

  <rect class="box" x="950" y="145" width="150" height="70" rx="6" />
  <text class="text small" x="1025" y="172">
    <tspan x="1025" dy="0">Probes</tspan>
    <tspan x="1025" dy="20">FTL + geodesics</tspan>
  </text>

  <path class="arrow" d="M220 180 L280 180" />
  <text class="text small" x="250" y="165">params.txt</text>
  <path class="arrow" d="M450 180 L510 180" />
  <text class="text small" x="480" y="165">initial data</text>
  <path class="arrow" d="M680 180 L740 180" />
  <text class="text small" x="710" y="165">dumps</text>
  <path class="arrow" d="M890 180 L950 180" />
  <text class="text small" x="920" y="165">frames</text>

  <rect class="panel" x="185" y="340" width="830" height="200" rx="8" />
  <text class="text title" x="600" y="370">Scoring and archive update</text>

  <rect class="box" x="265" y="425" width="150" height="70" rx="6" />
  <text class="text small" x="340" y="452">
    <tspan x="340" dy="0">score.py</tspan>
    <tspan x="340" dy="20">fitness</tspan>
  </text>

  <rect class="box" x="525" y="425" width="190" height="70" rx="6" />
  <text class="text small" x="620" y="452">
    <tspan x="620" dy="0">MAP-Elites archive</tspan>
    <tspan x="620" dy="20">best per behavior bin</tspan>
  </text>

  <rect class="box" x="815" y="425" width="145" height="70" rx="6" />
  <text class="text small" x="887" y="452">
    <tspan x="887" dy="0">trajectory.jsonl</tspan>
    <tspan x="887" dy="20">all evals logged</tspan>
  </text>

  <path class="arrow" d="M1025 215 L1025 300 L340 300 L340 425" />
  <text class="text small" x="695" y="292">episode metrics</text>
  <path class="arrow" d="M415 460 L525 460" />
  <text class="text small" x="470" y="445">score + descriptor</text>
  <path class="arrow" d="M715 460 L815 460" />
  <text class="text small" x="765" y="445">log result</text>

  <path class="arrow dash" d="M620 425 L620 325 L145 325 L145 215" />
  <text class="text small" x="375" y="318">mutate elite / sample feasible box</text>

  <path class="arrow dash" d="M365 215 L365 575 L887 575 L887 495" />
  <text class="text small" x="485" y="592">rejected solve: log only, no archive cell</text>
</svg>
