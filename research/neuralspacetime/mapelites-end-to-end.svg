<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-labelledby="title desc">
  <title id="title">MAP-Elites end-to-end overview</title>
  <desc id="desc">Search proposes matter, GRTresna solves constraints, GRTeclyn evolves the spacetime, probes score it, and the archive feeds the next proposal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111111" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="820" fill="#ffffff" />

  <style>
    .panel { fill: #ffffff; stroke: #555555; stroke-width: 2; }
    .box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #000000; text-anchor: middle; }
    .small { font-size: 15px; }
    .title { font-size: 18px; font-weight: 700; }
    .arrow { fill: none; stroke: #111111; stroke-width: 2.5; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 7 6; }
    .label-bg { fill: #ffffff; stroke: none; }
  </style>

  <rect class="panel" x="110" y="40" width="880" height="210" rx="8" />
  <text class="text title" x="550" y="72">Quality-Diversity loop</text>
  <rect class="box" x="380" y="95" width="340" height="80" rx="6" />
  <text class="text" x="550" y="123">
    <tspan x="550" dy="0">MAP-Elites archive</tspan>
    <tspan x="550" dy="24">8x8 cells - best score per bin</tspan>
  </text>
  <rect class="box" x="170" y="155" width="300" height="80" rx="6" />
  <text class="text" x="320" y="183">
    <tspan x="320" dy="0">Proposer</tspan>
    <tspan x="320" dy="24">mutate elite - sample feasible box</tspan>
  </text>
  <path class="arrow" d="M470 170 C520 210, 600 210, 660 178" />
  <path class="arrow dash" d="M550 175 C505 235, 415 250, 335 235" />

  <rect class="panel" x="210" y="330" width="680" height="210" rx="8" />
  <text class="text title" x="550" y="362">Matter-first physics</text>
  <rect class="box" x="285" y="390" width="260" height="80" rx="6" />
  <text class="text" x="415" y="418">
    <tspan x="415" dy="0">GRTresna</tspan>
    <tspan x="415" dy="24">paint lumps - York solve</tspan>
    <tspan x="415" dy="24">CPU / MPI</tspan>
  </text>
  <rect class="box" x="610" y="390" width="260" height="80" rx="6" />
  <text class="text" x="740" y="418">
    <tspan x="740" dy="0">GRTeclyn</tspan>
    <tspan x="740" dy="24">BSSN/CCZ4 + matter</tspan>
    <tspan x="740" dy="24">GPU evolution</tspan>
  </text>
  <path class="arrow" d="M545 430 L610 430" />
  <rect class="label-bg" x="550" y="405" width="58" height="24" />
  <text class="text small" x="579" y="423">ID</text>

  <rect class="panel" x="240" y="615" width="620" height="160" rx="8" />
  <text class="text title" x="550" y="647">Metric discovery</text>
  <rect class="box" x="280" y="675" width="180" height="60" rx="6" />
  <text class="text small" x="370" y="701">
    <tspan x="370" dy="0">Plotfiles +</tspan>
    <tspan x="370" dy="20">constraint logs</tspan>
  </text>
  <rect class="box" x="500" y="675" width="180" height="60" rx="6" />
  <text class="text small" x="590" y="701">
    <tspan x="590" dy="0">FTL probes</tspan>
    <tspan x="590" dy="20">persistence + geodesic</tspan>
  </text>
  <rect class="box" x="720" y="675" width="110" height="60" rx="6" />
  <text class="text small" x="775" y="701">
    <tspan x="775" dy="0">score.py</tspan>
    <tspan x="775" dy="20">fitness</tspan>
  </text>
  <path class="arrow" d="M460 705 L500 705" />
  <path class="arrow" d="M680 705 L720 705" />

  <rect class="box" x="905" y="650" width="145" height="70" rx="6" />
  <text class="text small" x="977" y="678">
    <tspan x="977" dy="0">trajectory.jsonl</tspan>
    <tspan x="977" dy="20">all evals logged</tspan>
  </text>

  <path class="arrow" d="M320 235 L320 300 L415 300 L415 390" />
  <rect class="label-bg" x="250" y="275" width="225" height="36" />
  <text class="text small" x="362" y="291">
    <tspan x="362" dy="0">18-D shell params</tspan>
    <tspan x="362" dy="18">params.txt</tspan>
  </text>

  <path class="arrow" d="M740 470 L740 590 L370 590 L370 675" />
  <rect class="label-bg" x="665" y="560" width="150" height="22" />
  <text class="text small" x="740" y="577">every PLOT_INTERVAL</text>

  <path class="arrow dash" d="M415 470 C330 520, 260 610, 260 740 L905 685" />
  <rect class="label-bg" x="115" y="720" width="190" height="42" />
  <text class="text small" x="210" y="737">
    <tspan x="210" dy="0">rejected solve</tspan>
    <tspan x="210" dy="18">Ham/Mom gate</tspan>
  </text>

  <path class="arrow" d="M775 675 C775 565, 775 350, 720 140" />
  <rect class="label-bg" x="760" y="505" width="128" height="22" />
  <text class="text small" x="824" y="522">descriptor -> bin</text>
  <path class="arrow" d="M830 705 L905 685" />
</svg>
