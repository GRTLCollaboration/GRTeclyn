<svg xmlns="http://www.w3.org/2000/svg" width="960" height="940" viewBox="0 0 960 940" role="img" aria-labelledby="title desc">
  <title id="title">MAP-Elites end-to-end overview</title>
  <desc id="desc">A proposer suggests matter parameters, GRTresna solves the constraints, GRTeclyn evolves the spacetime, plotfiles are probed and scored, the archive stores the best per behavior bin and feeds the next proposal, and every evaluation is logged.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#000000" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="940" fill="#ffffff" />

  <style>
    text { font-family: "Times New Roman", Times, Georgia, serif; fill: #000000; }
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
    .name { font-size: 22px; text-anchor: middle; }
    .sub { font-size: 17px; font-style: italic; text-anchor: middle; }
    .edge { fill: none; stroke: #000000; stroke-width: 1.8; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 6 5; }
    .lbl { font-size: 16px; text-anchor: middle; }
    .lblbg { fill: #ffffff; }
    .title { font-size: 26px; font-weight: 700; text-anchor: middle; }
  </style>

  <text class="title" x="480" y="44">MAP-Elites FTL discovery loop</text>

  <!-- main pipeline column, centered at x=480 -->
  <rect class="box" x="360" y="80"  width="240" height="68" rx="6" />
  <text class="name" x="480" y="111">Proposer</text>
  <text class="sub"  x="480" y="134">matter parameters</text>

  <rect class="box" x="360" y="210" width="240" height="68" rx="6" />
  <text class="name" x="480" y="241">GRTresna</text>
  <text class="sub"  x="480" y="264">constraint solve</text>

  <rect class="box" x="360" y="340" width="240" height="68" rx="6" />
  <text class="name" x="480" y="371">GRTeclyn</text>
  <text class="sub"  x="480" y="394">GPU evolution</text>

  <rect class="box" x="360" y="470" width="240" height="68" rx="6" />
  <text class="name" x="480" y="501">Plotfiles</text>
  <text class="sub"  x="480" y="524">constraint logs</text>

  <rect class="box" x="360" y="600" width="240" height="68" rx="6" />
  <text class="name" x="480" y="631">Probes</text>
  <text class="sub"  x="480" y="654">FTL and geodesics</text>

  <rect class="box" x="360" y="730" width="240" height="68" rx="6" />
  <text class="name" x="480" y="761">score.py</text>
  <text class="sub"  x="480" y="784">fitness</text>

  <rect class="box" x="360" y="845" width="240" height="68" rx="6" />
  <text class="name" x="480" y="876">MAP-Elites archive</text>
  <text class="sub"  x="480" y="899">best per behavior bin</text>

  <!-- pipeline arrows (straight, centered) -->
  <path class="edge" d="M480 148 L480 210" />
  <rect class="lblbg" x="487" y="167" width="92" height="22" />
  <text class="lbl" x="533" y="183">params.txt</text>

  <path class="edge" d="M480 278 L480 340" />
  <rect class="lblbg" x="487" y="297" width="96" height="22" />
  <text class="lbl" x="535" y="313">initial data</text>

  <path class="edge" d="M480 408 L480 470" />
  <rect class="lblbg" x="487" y="427" width="74" height="22" />
  <text class="lbl" x="524" y="443">dumps</text>

  <path class="edge" d="M480 538 L480 600" />
  <rect class="lblbg" x="487" y="557" width="74" height="22" />
  <text class="lbl" x="524" y="573">frames</text>

  <path class="edge" d="M480 668 L480 730" />
  <rect class="lblbg" x="487" y="687" width="74" height="22" />
  <text class="lbl" x="524" y="703">metrics</text>

  <path class="edge" d="M480 798 L480 845" />
  <rect class="lblbg" x="487" y="810" width="150" height="22" />
  <text class="lbl" x="562" y="826">score + descriptor</text>

  <!-- trajectory log on the left -->
  <rect class="box" x="40" y="730" width="220" height="68" rx="6" />
  <text class="name" x="150" y="761">trajectory.jsonl</text>
  <text class="sub"  x="150" y="784">all evaluations logged</text>

  <!-- score.py logs every eval to trajectory -->
  <path class="edge" d="M360 764 L260 764" />
  <rect class="lblbg" x="268" y="743" width="82" height="22" />
  <text class="lbl" x="309" y="759">log eval</text>

  <!-- rejected GRTresna solve is logged only -->
  <path class="edge dash" d="M360 244 L150 244 L150 730" />
  <rect class="lblbg" x="55" y="233" width="180" height="22" />
  <text class="lbl" x="145" y="249">rejected: log only</text>

  <!-- archive feedback to proposer on the right -->
  <path class="edge" d="M600 879 L800 879 L800 114 L600 114" />
  <text class="lbl" x="838" y="500" transform="rotate(90 838 500)">mutate elite / sample feasible box</text>
</svg>
