<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1110" viewBox="0 0 980 1110" role="img" aria-labelledby="title desc">
  <title id="title">MAP-Elites end-to-end overview</title>
  <desc id="desc">A proposer suggests matter parameters, GRTresna solves the constraints, GRTeclyn evolves the spacetime, plotfiles are probed and scored, the archive stores the best per behavior bin and feeds the next proposal, and every evaluation is logged.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#000000" />
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="1110" fill="#ffffff" />

  <style>
    text { font-family: "Times New Roman", Times, Georgia, serif; fill: #000000; }
    .box { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
    .name { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .desc { font-size: 16px; text-anchor: middle; }
    .edge { fill: none; stroke: #000000; stroke-width: 1.8; marker-end: url(#arrow); }
    .dash { stroke-dasharray: 6 5; }
    .lbl { font-size: 16px; font-style: italic; text-anchor: middle; }
    .lblbg { fill: #ffffff; }
    .title { font-size: 26px; font-weight: 700; text-anchor: middle; }
  </style>

  <text class="title" x="490" y="44">MAP-Elites FTL discovery loop</text>

  <!-- main pipeline column, centered at x=480 -->
  <rect class="box" x="360" y="80" width="240" height="100" rx="6" />
  <text class="name" x="480" y="114">Proposer</text>
  <text class="desc" x="480" y="140">MAP-Elites suggests the</text>
  <text class="desc" x="480" y="162">next matter parameters</text>

  <rect class="box" x="360" y="228" width="240" height="100" rx="6" />
  <text class="name" x="480" y="262">GRTresna</text>
  <text class="desc" x="480" y="288">solves the constraints</text>
  <text class="desc" x="480" y="310">for valid initial data</text>

  <rect class="box" x="360" y="376" width="240" height="100" rx="6" />
  <text class="name" x="480" y="410">GRTeclyn</text>
  <text class="desc" x="480" y="436">evolves the spacetime</text>
  <text class="desc" x="480" y="458">forward in time on GPU</text>

  <rect class="box" x="360" y="524" width="240" height="100" rx="6" />
  <text class="name" x="480" y="558">Plotfiles</text>
  <text class="desc" x="480" y="584">field snapshots saved</text>
  <text class="desc" x="480" y="606">with constraint logs</text>

  <rect class="box" x="360" y="672" width="240" height="100" rx="6" />
  <text class="name" x="480" y="706">Probes</text>
  <text class="desc" x="480" y="732">measure FTL, geodesics</text>
  <text class="desc" x="480" y="754">and stability</text>

  <rect class="box" x="360" y="820" width="240" height="100" rx="6" />
  <text class="name" x="480" y="854">score.py</text>
  <text class="desc" x="480" y="880">diagnostics combined</text>
  <text class="desc" x="480" y="902">into one fitness value</text>

  <rect class="box" x="360" y="968" width="240" height="100" rx="6" />
  <text class="name" x="480" y="1002">MAP-Elites archive</text>
  <text class="desc" x="480" y="1028">keeps the best result</text>
  <text class="desc" x="480" y="1050">in each behavior bin</text>

  <!-- pipeline arrows (straight, centered) -->
  <path class="edge" d="M480 180 L480 228" />
  <rect class="lblbg" x="487" y="192" width="92" height="22" />
  <text class="lbl" x="533" y="208">params.txt</text>

  <path class="edge" d="M480 328 L480 376" />
  <rect class="lblbg" x="487" y="340" width="96" height="22" />
  <text class="lbl" x="535" y="356">initial data</text>

  <path class="edge" d="M480 476 L480 524" />
  <rect class="lblbg" x="487" y="488" width="74" height="22" />
  <text class="lbl" x="524" y="504">dumps</text>

  <path class="edge" d="M480 624 L480 672" />
  <rect class="lblbg" x="487" y="636" width="74" height="22" />
  <text class="lbl" x="524" y="652">frames</text>

  <path class="edge" d="M480 772 L480 820" />
  <rect class="lblbg" x="487" y="784" width="74" height="22" />
  <text class="lbl" x="524" y="800">metrics</text>

  <path class="edge" d="M480 920 L480 968" />
  <rect class="lblbg" x="487" y="932" width="150" height="22" />
  <text class="lbl" x="562" y="948">score + descriptor</text>

  <!-- trajectory log on the left -->
  <rect class="box" x="40" y="820" width="240" height="100" rx="6" />
  <text class="name" x="160" y="854">trajectory.jsonl</text>
  <text class="desc" x="160" y="880">records every</text>
  <text class="desc" x="160" y="902">evaluation run</text>

  <!-- score.py logs every eval to trajectory -->
  <path class="edge" d="M360 870 L280 870" />
  <rect class="lblbg" x="286" y="849" width="74" height="22" />
  <text class="lbl" x="323" y="865">log eval</text>

  <!-- rejected GRTresna solve is logged only -->
  <path class="edge dash" d="M360 278 L160 278 L160 820" />
  <rect class="lblbg" x="65" y="262" width="190" height="22" />
  <text class="lbl" x="160" y="278">rejected: log only</text>

  <!-- archive feedback to proposer on the right -->
  <path class="edge" d="M600 1018 L820 1018 L820 130 L600 130" />
  <text class="lbl" x="856" y="574" transform="rotate(90 856 574)">mutate elite / sample feasible box</text>
</svg>
