include: '.gitlab/.gitlab-ci-common.yml'

csd3-a100-build:
  stage: build
  tags:
    - csd3
  script:
    - cd ${AMREX_HOME}/Tools/Plotfile
    - make -j 8 COMP=gnu programs=fcompare  #Build fcompare tool
    - cd ${AMREX_HOME}/Tools/Postprocessing/C_Src
    - make -j 8 COMP=gnu particle_compare.exe  #Build particle compare tool
    - cd ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH
    - make -j 8 ${BUILD_CONFIG}
    - export STORE=$(realpath ${HOME}/build)
    - echo "STORE=$(realpath ${HOME}/build)" >> ${HOME}/${CI_PROJECT_DIR}/build.env
    - if [[ ! -d ${STORE} ]]; then
    -   mkdir ${STORE}
    - fi    
    - mv ${AMREX_HOME}/Tools/Plotfile/fcompare.gnu.ex ${STORE}
    - mv ${AMREX_HOME}/Tools/Postprocessing/C_Src/particle_compare.exe ${STORE}
    - mv ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH/main3d.gnu.DEBUG.MPI.CUDA.ex ${STORE}
  artifacts:
    reports:
      dotenv: ${HOME}/${CI_PROJECT_DIR}/build.env

csd3-a100-test:
  stage: test
  tags:
    - csd3
  dependencies:
    - csd3-a100-build
  script:
    - cd ${HOME}/${CI_PROJECT_DIR}/Tests
    - make -j 8 ${BUILD_CONFIG}
    - flock ${HOME}/${QOS_INTR_LOCK_FILE} salloc ${SRUN_FLAGS} make run ${BUILD_CONFIG}    
    - cd ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH
    - flock ${HOME}/${QOS_INTR_LOCK_FILE} srun ${SRUN_FLAGS} ${STORE}/main3d.gnu.DEBUG.MPI.CUDA.ex ./params_test.txt
    - source ${HOME}/${CI_PROJECT_DIR}/.gitlab/.gitlab-ci-test-output.sh ${STORE} ${CI_PROJECT_DIR}
