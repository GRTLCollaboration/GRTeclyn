include: '.gitlab/.gitlab-ci-common.yml'

csd3-a100-build:
  stage: build
  tags:
    - csd3
  rules:
    # Scheduled pipelines only run the sweep job, skip the build
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
  script:
    - cd ${AMREX_HOME}/Tools/Plotfile
    # Build fcompare tool
    - make -j 8 COMP=gnu programs=fcompare
    - cd ${AMREX_HOME}/Tools/Postprocessing/C_Src
    # Build particle compare tool
    - make -j 8 COMP=gnu particle_compare.exe
    # Build BinaryBH example
    - cd ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH
    - make -j 8 ${BUILD_CONFIG}
    # Build Klein Gordon example
    - cd ${HOME}/${CI_PROJECT_DIR}/Examples/KleinGordon
    - make -j 8 ${BUILD_CONFIG}
    # Build KerrBH example
    - cd ${HOME}/${CI_PROJECT_DIR}/Examples/KerrBH
    - make -j 8 ${BUILD_CONFIG}
    # Build tests
    - cd ${HOME}/${CI_PROJECT_DIR}/Tests
    - make -j 8 ${BUILD_CONFIG}
    - >
      if [[ ! -d ${BINARY_DIR} ]]; then
        mkdir ${BINARY_DIR}
      fi
    # Copy the built tools and binaries into BINARY_DIR. Copying (rather than
    # moving) keeps the originals in place so that retrying this job after a
    # failure simply overwrites the copies
    - cp ${AMREX_HOME}/Tools/Plotfile/fcompare.gnu.ex ${BINARY_DIR}
    - cp ${AMREX_HOME}/Tools/Postprocessing/C_Src/particle_compare.exe ${BINARY_DIR}
    - >
      cp ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH/BinaryBH3d.gnu.DEBUG.MPI.CUDA.ex
      ${BINARY_DIR}/
    - >
      cp ${HOME}/${CI_PROJECT_DIR}/Examples/KleinGordon/KleinGordon3d.gnu.DEBUG.MPI.CUDA.ex
      ${BINARY_DIR}/
    - >
      cp ${HOME}/${CI_PROJECT_DIR}/Examples/KerrBH/KerrBH3d.gnu.DEBUG.MPI.CUDA.ex
      ${BINARY_DIR}/
    - mv ${HOME}/${CI_PROJECT_DIR}/Tests/Tests3d.gnu.DEBUG.MPI.CUDA.ex ${BINARY_DIR}

csd3-a100-test:
  stage: test
  tags:
    - csd3
  rules:
    # Scheduled pipelines only run the sweep job, skip the test
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
  dependencies:
    - csd3-a100-build
  script:
    # Copy binaries back into their original directories. Copying (rather
    # than moving) keeps the build directory intact so that retrying this
    # job after a failure simply overwrites the copies
    - cp ${BINARY_DIR}/Tests3d.gnu.DEBUG.MPI.CUDA.ex ${HOME}/${CI_PROJECT_DIR}/Tests
    - >
      cp ${BINARY_DIR}/BinaryBH3d.gnu.DEBUG.MPI.CUDA.ex
      ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH
    - >
      cp ${BINARY_DIR}/KleinGordon3d.gnu.DEBUG.MPI.CUDA.ex
      ${HOME}/${CI_PROJECT_DIR}/Examples/KleinGordon
    - >
      cp ${BINARY_DIR}/KerrBH3d.gnu.DEBUG.MPI.CUDA.ex
      ${HOME}/${CI_PROJECT_DIR}/Examples/KerrBH
    - > # Prepare the output directory - there is a single directory for ALL examples
      if [[ ! -d ${OUTPUT_DIR} ]]; then
        mkdir ${OUTPUT_DIR}
      fi
    - |
      set +e
      JOB_ID=$(flock ${QOS_INTR_LOCK_FILE} \
      sbatch -W --parsable ${HOME}/${CI_PROJECT_DIR}/.gitlab/run-examples.sh)
      SBATCH_RC=$?
      set -e

      # Print stdout/stderr from the Slurm batch job if available
      if [[ -n "${JOB_ID}" ]]; then
        cat "slurm-${JOB_ID}.out" || true
      fi

      # Fail CI after printing logs
      if [[ ${SBATCH_RC} -ne 0 ]]; then
        echo "Slurm job ${JOB_ID:-unknown} failed with exit code ${SBATCH_RC}"
        exit ${SBATCH_RC}
      fi

    # Use fcompare to check plotfiles for correctness
    - >
      ${BINARY_DIR}/fcompare.gnu.ex ${ERR_TOL_FLAGS}
      ${OUTPUT_DIR}/BinaryBH_00008/ ${COMPARE_DIR}/BinaryBH/plt00008_compare
    - >
      ${BINARY_DIR}/fcompare.gnu.ex ${ERR_TOL_FLAGS}
      ${OUTPUT_DIR}/KleinGordon_00008/ ${COMPARE_DIR}/KleinGordon/plt00008_compare
    - >
      ${BINARY_DIR}/fcompare.gnu.ex ${ERR_TOL_FLAGS}
      ${OUTPUT_DIR}/KerrBH_00008/ ${COMPARE_DIR}/KerrBH/plt00008_compare
    # Use Particle compare tool to check the punctures
    - >
      ${BINARY_DIR}/particle_compare.exe ${ERR_TOL_FLAGS}
      ${OUTPUT_DIR}/BinaryBH_00008/ ${COMPARE_DIR}/BinaryBH/plt00008_compare/ particles

# Automatic cleanup after a successful pipeline: the test artifacts are no
# longer needed once the test stage has passed
csd3-a100-cleanup:
  stage: cleanup
  tags:
    - csd3
  rules:
    # Scheduled pipelines only run the sweep job, skip the cleanup job
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
  needs:
    - job: csd3-a100-test
      optional: true
  when: on_success
  script:
    - rm -rf ${HOME}/a100-build-${CI_PIPELINE_ID}
    - rm -rf ${OUTPUT_DIR}

# On failure the build directory is deliberately kept so the test stage can
# be retried on its own. Leftover artifacts from failed pipelines are
# removed by the weekly sweep job below (older than 14 days)
csd3-a100-sweep:
  stage: cleanup
  tags:
    - csd3
  rules:
    # Only ever runs from a scheduled pipeline
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - find ${HOME} -maxdepth 1 -type d -name 'a100-build-*' -mtime +14 -exec rm -rf {} +
    - >
      find /rds/project/rds-YVo7YUJF2mk/grteclyn-ci-svc
      -maxdepth 1 -type d -name 'a100-test-*' -mtime +14 -exec rm -rf {} +
    - echo "Sweep complete"
