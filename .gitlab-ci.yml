include: '.gitlab/.gitlab-ci-common.yml'

csd3-a100-build:
  stage: build
  tags:
    - csd3
  script:
    - cd ${AMREX_HOME}/Tools/Plotfile
    # Build fcompare tool
    - make -j 8 COMP=gnu programs=fcompare
    - cd ${AMREX_HOME}/Tools/Postprocessing/C_Src
    # Build particle compare tool
    - make -j 8 COMP=gnu particle_compare.exe
    - cd ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH
    - make -j 8 ${BUILD_CONFIG}
    - >
      if [[ ! -d ${BINARY_DIR} ]]; then
        mkdir ${BINARY_DIR}
      fi
    - mv ${AMREX_HOME}/Tools/Plotfile/fcompare.gnu.ex ${BINARY_DIR}
    - mv ${AMREX_HOME}/Tools/Postprocessing/C_Src/particle_compare.exe ${BINARY_DIR}
    - mv ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH/main3d.gnu.DEBUG.MPI.CUDA.ex ${BINARY_DIR}
  after_script:
    - rm -rf ${HOME}/${QOS_INTR_LOCK_FILE}    

csd3-a100-test:
  stage: test
  tags:
    - csd3
  dependencies:
    - csd3-a100-build
  script:
    - cd ${HOME}/${CI_PROJECT_DIR}/Tests
    - make -j 8 ${BUILD_CONFIG}
    - flock ${HOME}/${QOS_INTR_LOCK_FILE} salloc ${SRUN_FLAGS} make run ${BUILD_CONFIG}    
    - cd ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH
    - >
      if [[ ! -d ${OUTPUT_DIR} ]]; then
        mkdir ${OUTPUT_DIR}
      fi
    - flock ${HOME}/${QOS_INTR_LOCK_FILE} srun ${SRUN_FLAGS} ${BINARY_DIR}/main3d.gnu.DEBUG.MPI.CUDA.ex ./params_test.txt amr.plot_file=${OUTPUT_DIR}/plt
    - ${BINARY_DIR}/fcompare.gnu.ex ${ERR_TOL_FLAGS} ${OUTPUT_DIR}/plt00008/ ${COMPARE_DIR}/plt00008_compare
    - ${BINARY_DIR}/particle_compare.exe ${ERR_TOL_FLAGS} ${OUTPUT_DIR}/plt00008/ ${COMPARE_DIR}/plt00008_compare/ particles
  after_script:
    - rm -rf ${HOME}/${QOS_INTR_LOCK_FILE}
    # This deletes BINARY_DIR but because it was defined in
    # the before_script, there is no way to access that
    # environment variable in the after_script
    - rm -rf ${HOME}/a100-build-${CI_PIPELINE_ID}
    - >
      if [[ -d ${OUTPUT_DIR} ]]; then
        rm -rf ${OUTPUT_DIR}
      fi
