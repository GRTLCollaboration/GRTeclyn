include: '.gitlab-ci-common.yml'

csd3-a100:
  stage: test
  tags:
    - csd3
  script:
    - module purge
    - module use ${MODULEPATHS_A100}
    - module load ${MODULES_A100}
    - export HDF5_HOME=$(which h5diff | sed 's/bin\/h5diff//') #Override system version of hdf5
    - export AMREX_HOME=$(realpath ${HOME}/${CI_PROJECT_DIR}/../amrex)
    - if [[ -d ${AMREX_HOME} ]]; then
    -   cd ${AMREX_HOME}
    -   git fetch --depth 1
    -   git reset --hard origin/development
    - else
    -   git clone --depth 1 https://github.com/AMReX-Codes/amrex.git ${AMREX_HOME}
    - fi
    - cd ${AMREX_HOME}/Tools/Plotfile
    - make -j 8 COMP=gnu programs=fcompare  #Build fcompare tool
    - cd ${AMREX_HOME}/Tools/Postprocessing/C_Src
    - make -j 8 COMP=gnu particle_compare.exe  #Build particle compare tool
    - cd ${HOME}/${CI_PROJECT_DIR}/Tests
    - make -j 8 ${BUILD_CONFIG}
    - flock ${HOME}/${QOS_INTR_LOCK_FILE} salloc ${SRUN_FLAGS} make run ${BUILD_CONFIG}
    - cd ${HOME}/${CI_PROJECT_DIR}/Examples/BinaryBH
    - make -j 8 ${BUILD_CONFIG}
    - flock ${HOME}/${QOS_INTR_LOCK_FILE} srun ${SRUN_FLAGS} ./main3d.gnu.DEBUG.MPI.CUDA.ex ./params_test.txt
    - count=0
    - while [ $count -le 9 ]; do
    -   if [[ -d plt00008 ]]; then
    -     ${AMREX_HOME}/Tools/Plotfile/fcompare.gnu.ex ${ERR_TOL_FLAGS} --abort_if_not_all_found plt00008 ${HOME}/${CI_PROJECT_DIR}/.github/workflows/data/plt00008_compare/ 
    -     ${AMREX_HOME}/Tools/Postprocessing/C_Src/particle_compare.exe ${ERR_TOL_FLAGS} plt00008 ${HOME}/${CI_PROJECT_DIR}/.github/workflows/data/plt00008_compare/ particles
    -     break
    -   else
    -     sleep 30
    -     ((count++))
    -     echo "Attempt number " $count " of 10"
    -   fi
    - done
  after_script:
    - rm -rf ${HOME}/${QOS_INTR_LOCK_FILE}
