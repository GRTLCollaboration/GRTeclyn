name: Regression Tests

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AMREX_HOME: ${{ github.workspace }}/amrex
  EXAMPLES_DIR: ${{ github.workspace }}/Examples/
  GCC_VERSION: 14
  BUILD_ARGS: >
    COMP=gnu
    USE_MPI=TRUE
    USE_CCACHE=TRUE

jobs:
  build:
    name: Build fcompare
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout GRTeclyn
      uses: actions/checkout@v4

    - name: Set up common actions
      id: common
      uses: ./.github/workflows/regression-tests-setup
      with:
        gcc_version: ${{ env.GCC_VERSION }}

    - name: Set Up Cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.workflow }}-${{ github.job }}-git-${{ github.sha }}
        restore-keys: |
             ccache-${{ github.workflow }}-${{ github.job }}-git-

    - name: Build fcompare tool
      run: make -j 4 ${{ env.BUILD_ARGS }} programs=fcompare
      working-directory: ${{ env.AMREX_HOME }}/Tools/Plotfile

    - name: Upload fcompare tool
      uses: actions/upload-artifact@v4
      with:
        name: fcompare.gnu.MPI.ex
        path: ${{ env.AMREX_HOME }}/Tools/Plotfile/fcompare.gnu.MPI.ex
        compression-level: 0

  binarybh:
    name: BinaryBH
    needs: build
    uses: ./.github/workflows/regression-tests-common.yml
    with:
      gcc_version: 14
      example: BinaryBH

  scalarfield:
    name: ScalarField
    needs: build
    uses: ./.github/workflows/regression-tests-common.yml
    with:
      gcc_version: 14
      example: ScalarField
